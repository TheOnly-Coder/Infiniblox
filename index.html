<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infiniblox</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
    #overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.5); color: #fff;
      font-family: sans-serif; font-size: 24px;
      z-index: 10; user-select: none; pointer-events: none;
    }
    #overlay.hidden { display: none; }
    #crosshair { position: fixed; top: 50%; left: 50%; width: 40px; height: 40px; margin-left: -20px; margin-top: -20px; z-index: 5; pointer-events: none; }
    #crosshair .dot { width: 6px; height: 6px; background: #000; border-radius: 50%; position: absolute; top: 17px; left: 17px; }
    #crosshair .tri { position: absolute; width: 0; height: 0; }
    #crosshair .tri.top { border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid #000; top: 6px; left: 16px; }
    #crosshair .tri.bottom { border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 6px solid #000; top: 28px; left: 16px; }
    #crosshair .tri.left { border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 6px solid #000; top: 16px; left: 6px; }
    #crosshair .tri.right { border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-right: 6px solid #000; top: 16px; left: 28px; }
    #held { position: fixed; top: calc(50% + 28px); left: 50%; margin-left: -16px; width: 32px; height: 32px; z-index: 6; pointer-events: none; display: none; perspective: 100px; }
    #held.show { display: block; }
    #held .h-cube-wrap { width: 32px; height: 32px; position: relative; transform-style: preserve-3d; animation: slowspin 6s linear infinite; }
    #held .h-face { position: absolute; width: 28px; height: 28px; left: 2px; top: 2px; border: 1px solid #aaa; }
    #held .h-face.front  { transform: translateZ(14px); }
    #held .h-face.back   { transform: rotateY(180deg) translateZ(14px); }
    #held .h-face.left   { transform: rotateY(-90deg) translateZ(14px); }
    #held .h-face.right  { transform: rotateY(90deg) translateZ(14px); }
    #held .h-face.top    { transform: rotateX(90deg) translateZ(14px); }
    #held .h-face.bottom { transform: rotateX(-90deg) translateZ(14px); }
    #hotbar { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; z-index: 5; pointer-events: none; user-select: none; }
    .hotbar-slot { width: 48px; height: 48px; border: 2px solid rgba(0,0,0,0.35); background: rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; perspective: 100px; position: relative; }
    .hotbar-slot.selected { border-color: #fff; background: rgba(255,255,255,0.18); }
    .hotbar-slot .slot-key { position: absolute; bottom: 1px; right: 3px; font-size: 9px; color: rgba(255,255,255,0.5); font-family: sans-serif; }
    .slot-cube-wrap { width: 32px; height: 32px; position: relative; transform-style: preserve-3d; animation: slowspin 6s linear infinite; }
    @keyframes slowspin { from { transform: rotateX(-25deg) rotateY(0deg); } to { transform: rotateX(-25deg) rotateY(360deg); } }
    .slot-cube-face { position: absolute; width: 28px; height: 28px; left: 2px; top: 2px; border: 1px solid #aaa; background: #fff; }
    .slot-cube-face.front  { transform: translateZ(14px); }
    .slot-cube-face.back   { transform: rotateY(180deg) translateZ(14px); }
    .slot-cube-face.left   { transform: rotateY(-90deg) translateZ(14px); }
    .slot-cube-face.right  { transform: rotateY(90deg) translateZ(14px); }
    .slot-cube-face.top    { transform: rotateX(90deg) translateZ(14px); }
    .slot-cube-face.bottom { transform: rotateX(-90deg) translateZ(14px); }
    #blockmenu { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; gap: 12px; z-index: 20; user-select: none; background: rgba(0,0,0,0.6); padding: 16px 20px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.2); flex-wrap: wrap; max-width: 500px; justify-content: center; }
    #blockmenu.open { display: flex; }
    .menu-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 6px; border-radius: 6px; transition: background 0.15s; }
    .menu-item:hover { background: rgba(255,255,255,0.15); }
    .menu-cube-wrap { width: 44px; height: 44px; position: relative; transform-style: preserve-3d; animation: slowspin 6s linear infinite; }
    .menu-cube-face { position: absolute; width: 38px; height: 38px; left: 3px; top: 3px; border: 1.5px solid rgba(0,0,0,0.25); }
    .menu-cube-face.front  { transform: translateZ(19px); }
    .menu-cube-face.back   { transform: rotateY(180deg) translateZ(19px); }
    .menu-cube-face.left   { transform: rotateY(-90deg) translateZ(19px); }
    .menu-cube-face.right  { transform: rotateY(90deg) translateZ(19px); }
    .menu-cube-face.top    { transform: rotateX(90deg) translateZ(19px); }
    .menu-cube-face.bottom { transform: rotateX(-90deg) translateZ(19px); }
    .menu-label { color: #fff; font-family: sans-serif; font-size: 10px; text-align: center; }
  </style>
</head>
<body>
  <div id="overlay">Click to play</div>
  <div id="crosshair"><div class="dot"></div><div class="tri top"></div><div class="tri bottom"></div><div class="tri left"></div><div class="tri right"></div></div>
  <div id="held"><div class="h-cube-wrap"><div class="h-face front"></div><div class="h-face back"></div><div class="h-face left"></div><div class="h-face right"></div><div class="h-face top"></div><div class="h-face bottom"></div></div></div>
  <div id="hotbar"></div>
  <div id="blockmenu"></div>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
(function() {
  // ===== CONSTANTS =====
  var CHUNK_SIZE = 16, RENDER_DISTANCE = 42, PLAYER_HEIGHT = 1.6;
  var BASE_SPEED = 3.6, MOVE_SPEED = BASE_SPEED, JUMP_FORCE = 7, GRAVITY = 20;
  var MOUSE_SENSITIVITY = 0.002, REACH = 7, TERRAIN_DEPTH = 6, SURFACE_Y = 5;
  var DX = [1, 0, -1, 0], DZ = [0, 1, 0, -1], OPP = [2, 3, 0, 1];
  var FACE_TO_DIR = { top: -1, bottom: -1, east: 0, west: 2, south: 1, north: 3 };
  var DIR_TO_FACE = ['east', 'south', 'west', 'north'];

  // ===== BLOCK TYPES =====
  var LAYER_COLORS = {
    0: { fill: 0x666666, edge: 0x444444 },
    1: { fill: 0xbbbbbb, edge: 0x999999 },
    2: { fill: 0xcccccc, edge: 0xaaaaaa },
    3: { fill: 0x8b6914, edge: 0x6b5010 },
    4: { fill: 0xa0782c, edge: 0x7a5c20 },
    5: { fill: 0x556b2f, edge: 0x3d4f22 }
  };
  var BLOCK_TYPES = {
    'default':  { fill: 0xffffff, edge: 0xbbbbbb, cssFill: '#ffffff', cssEdge: '#aaa', label: 'Default', redstone: false },
    'grass':    { fill: 0x556b2f, edge: 0x3d4f22, cssFill: '#556b2f', cssEdge: '#3d4f22', label: 'Grass', redstone: false },
    'dirt':     { fill: 0x8b6914, edge: 0x6b5010, cssFill: '#8b6914', cssEdge: '#6b5010', label: 'Dirt', redstone: false },
    'stone':    { fill: 0xbbbbbb, edge: 0x999999, cssFill: '#bbbbbb', cssEdge: '#888', label: 'Stone', redstone: false },
    'bedrock':  { fill: 0x666666, edge: 0x444444, cssFill: '#666666', cssEdge: '#444', label: 'Bedrock', redstone: false },
    'rs_torch': { fill: 0xcc2222, edge: 0x881111, cssFill: '#cc2222', cssEdge: '#881111', label: 'RS Torch', redstone: true },
    'rs_dust':  { fill: 0x881111, edge: 0x550808, cssFill: '#881111', cssEdge: '#550808', label: 'RS Dust', redstone: true },
    'repeater':  { fill: 0x888888, edge: 0x666666, cssFill: '#888', cssEdge: '#666', label: 'Repeater', redstone: true },
    'piston':   { fill: 0x887755, edge: 0x665533, cssFill: '#887755', cssEdge: '#665533', label: 'Piston', redstone: true }
  };
  var BLOCK_TYPE_LIST = Object.keys(BLOCK_TYPES);

  // ===== THREE.JS SETUP =====
  var scene = new THREE.Scene(); scene.background = new THREE.Color(0x87ceeb);
  var camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 200);
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  // Materials
  var layerFillM = {}, layerEdgeM = {};
  for (var ly = 0; ly < TERRAIN_DEPTH; ly++) {
    layerFillM[ly] = new THREE.MeshBasicMaterial({ color: LAYER_COLORS[ly].fill, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
    layerEdgeM[ly] = new THREE.LineBasicMaterial({ color: LAYER_COLORS[ly].edge });
  }
  var btFillM = {}, btEdgeM = {};
  for (var i = 0; i < BLOCK_TYPE_LIST.length; i++) {
    var bn = BLOCK_TYPE_LIST[i];
    btFillM[bn] = new THREE.MeshBasicMaterial({ color: BLOCK_TYPES[bn].fill, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
    btEdgeM[bn] = new THREE.LineBasicMaterial({ color: BLOCK_TYPES[bn].edge });
  }
  var torchTipMat = new THREE.MeshBasicMaterial({ color: 0xdd1111 });
  var torchTipDimMat = new THREE.MeshBasicMaterial({ color: 0x551111 });
  var torchStickMat = new THREE.MeshBasicMaterial({ color: 0x8B4513 });
  var repeaterGreyMat = new THREE.MeshBasicMaterial({ color: 0x888888, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
  var repeaterGreyEdgeMat = new THREE.LineBasicMaterial({ color: 0x666666 });
  var repeaterRedMat = new THREE.MeshBasicMaterial({ color: 0xdd1111 });
  var repeaterRedDimMat = new THREE.MeshBasicMaterial({ color: 0x551111 });
  var repeaterTickMat = new THREE.MeshBasicMaterial({ color: 0x444444 });
  var pistonBodyMat = new THREE.MeshBasicMaterial({ color: 0x887755, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
  var pistonBodyEdgeMat = new THREE.LineBasicMaterial({ color: 0x665533 });
  var pistonHeadMat = new THREE.MeshBasicMaterial({ color: 0xaaaaaa });
  var pistonArmMat = new THREE.MeshBasicMaterial({ color: 0x888888 });
  var dustMats = [];
  for (var dp = 0; dp <= 15; dp++) {
    var r = Math.floor(80 + (dp / 15) * 175);
    var g = Math.floor(dp / 15 * 30);
    dustMats.push(new THREE.MeshBasicMaterial({ color: (r << 16) | (g << 8), transparent: true, opacity: 0.9 }));
  }
  var dustEdgeMat = new THREE.LineBasicMaterial({ color: 0x550808 });

  var blockGeo = new THREE.BoxGeometry(1, 1, 1);
  var edgeGeo = new THREE.EdgesGeometry(blockGeo);
  var highlightMesh = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.01, 1.01, 1.01)), new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
  highlightMesh.visible = false; scene.add(highlightMesh);

  // ===== WORLD DATA =====
  var raycaster = new THREE.Raycaster(); raycaster.far = REACH;
  var screenCenter = new THREE.Vector2(0, 0);
  var targetBlock = null, targetNormal = null, targetIsRedstone = false;
  var worldBlocks = {}, chunkBlockSet = {}, chunks = {}, cloudChunks = {};
  var redstoneData = {}, redstoneMeshes = {};
  var updateQueue = [], currentTick = 0, tickAccum = 0;
  var TICK_RATE = 1 / 10;

  function bk(x, y, z) { return x + ',' + y + ',' + z; }
  function ck(cx, cz) { return cx + ',' + cz; }
  function nb(x, y, z, d) { return [x + DX[d], y, z + DZ[d]]; }
  function normalToDir(n) {
    if (Math.abs(n.x) > 0.5) return n.x > 0 ? 0 : 2;
    if (Math.abs(n.z) > 0.5) return n.z > 0 ? 1 : 3;
    return -1;
  }
  function playerFacingDir() {
    var fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    if (Math.abs(fx) > Math.abs(fz)) return fx > 0 ? 0 : 2;
    return fz > 0 ? 1 : 3;
  }
  function isRedstoneType(type) { return type === 'rs_torch' || type === 'rs_dust' || type === 'repeater' || type === 'piston'; }

  // ===== CHUNK SYSTEM =====
  function ensureChunkData(cx, cz) {
    var k = ck(cx, cz); if (chunkBlockSet[k]) return;
    chunkBlockSet[k] = {};
    for (var lx = 0; lx < CHUNK_SIZE; lx++) for (var lz = 0; lz < CHUNK_SIZE; lz++) {
      var wx = cx * CHUNK_SIZE + lx, wz = cz * CHUNK_SIZE + lz;
      for (var dy = 0; dy < TERRAIN_DEPTH; dy++) {
        var key = bk(wx, dy, wz);
        worldBlocks[key] = { terrain: true, layer: dy };
        chunkBlockSet[k][key] = true;
      }
    }
  }
  function rebuildChunk(cx, cz) {
    var k = ck(cx, cz);
    if (chunks[k]) { for (var li = 0; li < chunks[k].meshes.length; li++) { scene.remove(chunks[k].meshes[li].cm); scene.remove(chunks[k].meshes[li].em); chunks[k].meshes[li].cm.dispose(); chunks[k].meshes[li].em.dispose(); } delete chunks[k]; }
    var bs = chunkBlockSet[k]; if (!bs) return;
    var keys = Object.keys(bs); if (!keys.length) return;
    var buckets = {};
    for (var i = 0; i < keys.length; i++) {
      var p = keys[i].split(','), bx = +p[0], by = +p[1], bz = +p[2];
      var bd = worldBlocks[keys[i]];
      var bkey = bd.terrain ? 'T' + bd.layer : 'P' + bd.type;
      if (!buckets[bkey]) buckets[bkey] = [];
      buckets[bkey].push([bx, by, bz]);
    }
    var allM = [], allP = [], off = 0;
    var bkeys = Object.keys(buckets).sort();
    for (var bi = 0; bi < bkeys.length; bi++) {
      var bk2 = bkeys[bi], bp = buckets[bk2];
      var fm, em;
      if (bk2.charAt(0) === 'T') { var ln = +bk2.substring(1); fm = layerFillM[ln]; em = layerEdgeM[ln]; }
      else { var tn = bk2.substring(1); fm = btFillM[tn]; em = btEdgeM[tn]; }
      var cm = new THREE.InstancedMesh(blockGeo, fm, bp.length);
      var eg = new THREE.InstancedMesh(edgeGeo, em, bp.length);
      var m4 = new THREE.Matrix4();
      for (var j = 0; j < bp.length; j++) { m4.setPosition(bp[j][0], bp[j][1], bp[j][2]); cm.setMatrixAt(j, m4); eg.setMatrixAt(j, m4); allP.push(bp[j]); }
      cm.instanceMatrix.needsUpdate = true; eg.instanceMatrix.needsUpdate = true;
      cm.userData.ck = k; cm.userData.off = off;
      scene.add(cm); scene.add(eg);
      allM.push({ cm: cm, em: eg }); off += bp.length;
    }
    chunks[k] = { meshes: allM, positions: allP };
  }
  function destroyBlock(x, y, z) {
    var key = bk(x, y, z); if (!worldBlocks[key]) return;
    if (worldBlocks[key].terrain && worldBlocks[key].layer === 0) return;
    // Remove redstone if any
    if (redstoneData[key]) { removeRS(x, y, z); }
    delete worldBlocks[key];
    var c = ck(Math.floor(x / CHUNK_SIZE), Math.floor(z / CHUNK_SIZE));
    if (chunkBlockSet[c]) delete chunkBlockSet[c][key];
    rebuildChunk(Math.floor(x / CHUNK_SIZE), Math.floor(z / CHUNK_SIZE));
    scheduleRSUpdate(x, y, z, 0); scheduleRSUpdate(x, y, z + 1, 0); scheduleRSUpdate(x, y, z - 1, 0);
    scheduleRSUpdate(x + 1, y, z, 0); scheduleRSUpdate(x - 1, y, z, 0);
  }
  function placeBlock(x, y, z, type) {
    var key = bk(x, y, z); if (worldBlocks[key]) return false;
    if (Math.abs(x - playerPos.x) < 0.8 && Math.abs(z - playerPos.z) < 0.8 && y - 0.5 < playerPos.y + 0.2 && y + 0.5 > playerPos.y - PLAYER_HEIGHT) return false;
    // Remove dust if placing solid block on dust
    if (redstoneData[key] && redstoneData[key].type === 'rs_dust') removeRS(x, y, z);
    if (isRedstoneType(type)) {
      worldBlocks[key] = { placed: true, type: type, noCol: type === 'rs_dust' };
    } else {
      worldBlocks[key] = { placed: true, type: type };
    }
    var c = ck(Math.floor(x / CHUNK_SIZE), Math.floor(z / CHUNK_SIZE));
    if (!chunkBlockSet[c]) chunkBlockSet[c] = {};
    chunkBlockSet[c][key] = true;
    rebuildChunk(Math.floor(x / CHUNK_SIZE), Math.floor(z / CHUNK_SIZE));
    return true;
  }
  function createChunk(cx, cz) { var k = ck(cx, cz); if (chunks[k]) return; ensureChunkData(cx, cz); rebuildChunk(cx, cz); }
  function removeChunk(key) { if (!chunks[key]) return; for (var li = 0; li < chunks[key].meshes.length; li++) { scene.remove(chunks[key].meshes[li].cm); scene.remove(chunks[key].meshes[li].em); chunks[key].meshes[li].cm.dispose(); chunks[key].meshes[li].em.dispose(); } delete chunks[key]; }

  // ===== REDSTONE GEOMETRY BUILDERS =====
  function createTorchMesh(data) {
    var g = new THREE.Group();
    var stick = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.5, 0.12), torchStickMat);
    var tip = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 0.25), data.power > 0 ? torchTipMat : torchTipDimMat);
    tip.userData.isTip = true;
    var face = data.face || 'top';
    if (face === 'top') { stick.position.y = 0.25; tip.position.y = 0.56; }
    else if (face === 'north') { stick.rotation.x = Math.PI / 2; stick.position.z = -0.25; tip.rotation.x = Math.PI / 2; tip.position.z = -0.56; }
    else if (face === 'south') { stick.rotation.x = -Math.PI / 2; stick.position.z = 0.25; tip.rotation.x = -Math.PI / 2; tip.position.z = 0.56; }
    else if (face === 'east') { stick.rotation.z = -Math.PI / 2; stick.position.x = 0.25; tip.rotation.z = -Math.PI / 2; tip.position.x = 0.56; }
    else if (face === 'west') { stick.rotation.z = Math.PI / 2; stick.position.x = -0.25; tip.rotation.z = Math.PI / 2; tip.position.x = -0.56; }
    g.add(stick); g.add(tip);
    return g;
  }
  function getDustConnections(x, y, z) {
    var c = 0; // 4-bit: N=1, E=2, S=4, W=8
    for (var d = 0; d < 4; d++) { var n = nb(x, y, z, d); if (redstoneData[bk(n[0], n[1], n[2])] && redstoneData[bk(n[0], n[1], n[2])].type === 'rs_dust') c |= (1 << d); }
    return c;
  }
  function createDustMesh(data, x, y, z) {
    var g = new THREE.Group();
    var conn = getDustConnections(x, y, z);
    var pw = data.power;
    // Center dot
    var center = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.08, 0.3), dustMats[pw]);
    center.position.y = 0.46; g.add(center);
    // Arms
    for (var d = 0; d < 4; d++) {
      if (conn & (1 << d)) {
        var isNS = (d === 1 || d === 3);
        var arm = new THREE.Mesh(
          new THREE.BoxGeometry(isNS ? 0.2 : 0.5, 0.08, isNS ? 0.5 : 0.2),
          dustMats[pw]
        );
        arm.position.set(DX[d] * 0.25, 0.46, DZ[d] * 0.25);
        g.add(arm);
      }
    }
    // Edge lines on center
    var ce = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(0.3, 0.08, 0.3)), dustEdgeMat);
    ce.position.y = 0.46; g.add(ce);
    return g;
  }
  function createRepeaterMesh(data) {
    var g = new THREE.Group();
    // Half-height grey body
    var body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.45, 0.5), repeaterGreyMat);
    body.position.y = 0.225; g.add(body);
    var be = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(0.9, 0.45, 0.5)), repeaterGreyEdgeMat);
    be.position.y = 0.225; g.add(be);
    // Red line down middle
    var rmat = data.power > 0 ? repeaterRedMat : repeaterRedDimMat;
    rmat = rmat.clone(); rmat.userData.isPowerIndicator = true;
    var line = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.47, 0.15), rmat);
    line.position.set(0, 0.235, 0); line.userData.isPowerIndicator = true; g.add(line);
    // Tick indicator (dark bar showing delay 1-4)
    var tickW = 0.15 * data.delay;
    var tick = new THREE.Mesh(new THREE.BoxGeometry(tickW, 0.47, 0.08), repeaterTickMat);
    tick.position.set(-0.2, 0.235, 0.19); tick.userData.isTick = true; g.add(tick);
    // Small triangles on front/back to show direction
    var triSize = 0.12;
    var triGeo = new THREE.BufferGeometry();
    var tv = new Float32Array([-triSize, 0, 0, triSize, 0, -triSize, triSize, 0, triSize]);
    triGeo.setAttribute('position', new THREE.BufferAttribute(tv, 3));
    triGeo.computeVertexNormals();
    var tri = new THREE.Mesh(triGeo, rmat); tri.userData.isPowerIndicator = true;
    tri.position.set(0.45, 0.01, 0); tri.rotation.y = -Math.PI / 2; g.add(tri);
    // Rotate whole group based on direction
    g.rotation.y = -data.direction * Math.PI / 2;
    return g;
  }
  function createPistonMesh(data) {
    var g = new THREE.Group();
    // Body
    var body = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.85, 0.85), pistonBodyMat);
    body.position.y = 0.425; g.add(body);
    var be = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(0.85, 0.85, 0.85)), pistonBodyEdgeMat);
    be.position.y = 0.425; g.add(be);
    // Head (extends when powered)
    var headGroup = new THREE.Group();
    headGroup.userData.isHead = true;
    var head = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.7, 0.7), pistonHeadMat);
    head.position.x = 0.5; headGroup.add(head);
    var arm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.2), pistonArmMat);
    arm.position.x = 0.35; headGroup.add(arm);
    if (data.powered) headGroup.position.x = 1; else headGroup.position.x = 0;
    g.add(headGroup);
    g.rotation.y = -data.direction * Math.PI / 2;
    return g;
  }

  // ===== REDSTONE MESH MANAGEMENT =====
  function addRSMesh(x, y, z) {
    var key = bk(x, y, z); var data = redstoneData[key]; if (!data) return;
    removeRSMesh(x, y, z);
    var g;
    if (data.type === 'rs_torch') g = createTorchMesh(data);
    else if (data.type === 'rs_dust') g = createDustMesh(data, x, y, z);
    else if (data.type === 'repeater') g = createRepeaterMesh(data);
    else if (data.type === 'piston') g = createPistonMesh(data);
    if (!g) return;

  });
  window.addEventListener('resize', function() { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

  // ===== CHUNK LOADING =====
  function updateChunks() {
    var pcx = Math.floor(playerPos.x / CHUNK_SIZE), pcz = Math.floor(playerPos.z / CHUNK_SIZE);
    var cr = Math.ceil(RENDER_DISTANCE / CHUNK_SIZE), needed = {};
    for (var dx = -cr; dx <= cr; dx++) for (var dz = -cr; dz <= cr; dz++) {
      var cx = pcx + dx, cz = pcz + dz, wcx = cx * CHUNK_SIZE + 8, wcz = cz * CHUNK_SIZE + 8;
      var dist = Math.sqrt((wcx - playerPos.x) * (wcx - playerPos.x) + (wcz - playerPos.z) * (wcz - playerPos.z));
      if (dist <= RENDER_DISTANCE) { var key = ck(cx, cz); needed[key] = true; if (!chunks[key]) createChunk(cx, cz); if (!cloudChunks['c' + key]) createCloudChunk(cx, cz); }
    }
    for (var key in chunks) { if (!needed[key]) removeChunk(key); }
    for (var key in cloudChunks) { if (!needed[key.substring(1)]) removeCloudChunk(key); }
  }

  // ===== TARGET / RAYCASTING =====
  function updateTarget() {
    raycaster.setFromCamera(screenCenter, camera);
    var meshes = [];
    for (var key in chunks) { var ml = chunks[key].meshes; for (var mi = 0; mi < ml.length; mi++) meshes.push(ml[mi].cm); }
    // Add redstone meshes for raycasting
    var rsMeshArr = [];
    for (var rk in redstoneMeshes) {
      redstoneMeshes[rk].traverse(function(c) { if (c.isMesh) rsMeshArr.push(c); });
    }
    var allMeshes = meshes.concat(rsMeshArr);
    var hits = raycaster.intersectObjects(allMeshes, false);
    targetIsRedstone = false;
    if (hits.length > 0) {
      var hit = hits[0];
      // Check if this is a redstone mesh
      var rsKey = null;
      for (var rk2 in redstoneMeshes) {
        var found = false;
        redstoneMeshes[rk2].traverse(function(c) { if (c === hit.object) found = true; });
        if (found) { rsKey = rk2; break; }
      }
      if (rsKey) {
        var p2 = rsKey.split(',');
        targetBlock = { x: +p2[0], y: +p2[1], z: +p2[2] };
        targetNormal = hit.face.normal;
        targetIsRedstone = true;
      } else if (hit.object.isInstancedMesh) {
        var ck2 = hit.object.userData.ck;
        var off = hit.object.userData.off || 0;
        var pos = chunks[ck2].positions[off + hit.instanceId];
        targetBlock = { x: pos[0], y: pos[1], z: pos[2] };
        targetNormal = hit.face.normal;
      } else {
        targetBlock = null; targetNormal = null;
      }
      if (targetBlock) { highlightMesh.position.set(targetBlock.x, targetBlock.y, targetBlock.z); highlightMesh.visible = true; }
    } else { targetBlock = null; targetNormal = null; highlightMesh.visible = false; }
  }

  // ===== GAME LOOP =====
  var lastTime = performance.now();
  function animate() {
    requestAnimationFrame(animate);
    if (menuOpen) { renderer.render(scene, camera); return; }
    var now = performance.now(), dt = (now - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1; lastTime = now;
    // Tick system
    tickAccum += dt;
    while (tickAccum >= TICK_RATE) { tickAccum -= TICK_RATE; currentTick++; processTickQueue(); }
    // Movement
    var fwd = new THREE.Vector3(-Math.sin(yaw) * Math.cos(pitch), 0, -Math.cos(yaw) * Math.cos(pitch)).normalize();
    var rgt = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)).normalize();
    var md = new THREE.Vector3();
    if (keys['KeyW']) md.add(fwd); if (keys['KeyS']) md.sub(fwd);
    if (keys['KeyA']) md.sub(rgt); if (keys['KeyD']) md.add(rgt);
    if (keys['ShiftLeft'] || keys['ShiftRight']) MOVE_SPEED = BASE_SPEED / 0.6; else MOVE_SPEED = BASE_SPEED;
    if (md.lengthSq() > 0) {
      md.normalize();
      var tdx = md.x * MOVE_SPEED * dt, tdz = md.z * MOVE_SPEED * dt;
      var steps = Math.max(1, Math.ceil(Math.abs(tdx) / 0.4), Math.ceil(Math.abs(tdz) / 0.4));
      var sdx = tdx / steps, sdz = tdz / steps;
      for (var si = 0; si < steps; si++) { var mv = false; if (!collidesAt(playerPos.x + sdx, playerPos.y, playerPos.z)) { playerPos.x += sdx; mv = true; } if (!collidesAt(playerPos.x, playerPos.y, playerPos.z + sdz)) { playerPos.z += sdz; mv = true; } if (!mv) break; }
    }
    if (keys['Space'] && onGround) { velocity.y = JUMP_FORCE; onGround = false; }
    velocity.y -= GRAVITY * dt;
    var tdy = velocity.y * dt, vs = Math.max(1, Math.ceil(Math.abs(tdy) / 0.4)), sdy = tdy / vs;
    for (var vi = 0; vi < vs; vi++) {
      var ty = playerPos.y + sdy;
      if (collidesAt(playerPos.x, ty, playerPos.z)) {
        if (velocity.y <= 0) { var fy = ty - PEF; playerPos.y = Math.floor(fy + 0.5) + 0.5 + PEF; }
        velocity.y = 0; onGround = true; break;
      }
      playerPos.y = ty; onGround = false;
    }
    if (playerPos.y < -5) { playerPos.y = findGround(playerPos.x, playerPos.y, playerPos.z); velocity.y = 0; }
    camera.position.copy(playerPos);
    camera.rotation.order = 'YXZ'; camera.rotation.y = yaw; camera.rotation.x = pitch;
    updateChunks(); updateTarget(); renderer.render(scene, camera);
  }
  animate();
})();
  </script>
</body>
